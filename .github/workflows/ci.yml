name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job is a gate except "report". The gates live in scripts/check.sh, so a local run and CI
# always agree.
jobs:
  swift:
    name: Build and test (Xcode 27.2)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version

      - name: Set up JDK 21 for the pumpx2 oracle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the cliparser oracle JAR
        working-directory: vendor/pumpx2-oracle
        run: ./gradlew :cliparser:shadowJar

      - name: Build (warnings are errors)
        run: ./scripts/check.sh build

      - name: The root dependency graph stays LoopKit-free
        run: |
          if swift package show-dependencies --format json | grep -qi loopkit; then
            echo "::error::LoopKit is in the root TandemKit dependency graph"
            exit 1
          fi

      - name: Test (byte-exact oracle parity)
        run: ./scripts/check.sh test

      - name: Bench package builds and tests (never linked by the library)
        run: ./scripts/check.sh bench

  swift-lint:
    name: swift-format and SwiftLint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcrun swift-format --version
      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
      - run: ./scripts/check.sh format swiftlint

  lint:
    name: ShellCheck, actionlint, markdownlint, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint and markdownlint-cli2
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
          npm install --global markdownlint-cli2@0.24.0
      - run: ./scripts/check.sh shell actions markdown
      - name: Every vendored or linked package carries a LICENSE and an SBOM row
        run: ./scripts/check-sbom.sh

  report:
    name: Semgrep and Periphery (report only)
    runs-on: xcode-27
    continue-on-error: true
    steps:
      # Periphery builds the package, and the JPAKE target's mbedTLS sources are links into a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install Semgrep and Periphery
        run: |
          pipx install semgrep
          brew list periphery >/dev/null 2>&1 || brew install periphery
      - name: Semgrep (faBolus's shared residue rules)
        run: |
          curl -fsSL -o /tmp/deslop.yml https://raw.githubusercontent.com/faBolus-app/faBolus/main/.semgrep/deslop.yml
          semgrep --config /tmp/deslop.yml --metrics=off .
      # SwiftPM's default build system writes no index store, which Periphery reads, so it builds
      # with the native one.
      - name: Periphery (unused code)
        run: |
          swift build --build-system native --scratch-path .build-periphery
          periphery scan --retain-public --skip-build --index-store-path .build-periphery/debug/index/store
